# CI for this repository (ADR-0019).
#
# Runner: GitHub-hosted by default. To move to Blacksmith, set the repository
# variable CI_RUNNER to a Blacksmith label (e.g. blacksmith-2vcpu-ubuntu-2404)
# once the repo lives in a GitHub organization with the Blacksmith app
# installed. Any label must be Linux x64: the secrets job downloads a
# linux_x64 gitleaks build.
#
# Supply chain: third-party actions are pinned by commit SHA (SECURITY.md) and
# the repository only allows GitHub-owned actions plus fallow-rs/fallow.
# Jobs get a read-only token; nothing here needs a secret, so fork PRs run the
# same checks with the same (lack of) privileges.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardrails:
    name: guardrails
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned tools (versions from TECH_STACK.md)
        # playwright is installed for its types only (bench/harness/toggle_checks.py,
        # ADR-0023); no browsers are downloaded and no checks run here.
        run: python -m pip install --disable-pip-version-check ruff==0.16.9 mypy==2.3.1 playwright==1.63.0
      - name: Guard tests
        run: python -m unittest discover -s .claude/hooks
      - name: Bench harness tests (ADR-0022)
        run: python -m unittest discover -s bench/harness
      - name: Lint
        run: ruff check .claude/hooks bench/harness && ruff format --check .claude/hooks bench/harness
      - name: Types
        run: mypy --strict .claude/hooks bench/harness
      - name: Policy scan (AGENTS.md rules 1 and 9, §6)
        run: python .claude/hooks/policy_guard.py --scan

  secrets:
    name: secrets
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  fallow:
    name: fallow
    # fallow audit gates what a pull request changes (ADR-0018).
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the action reads the PR diff to scope findings to added lines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: fallow-rs/fallow@2b0f0b7283637bd408ae54942452b7468cc68f79 # v3.30.0
        with:
          command: audit
          version: 3.30.0

# CI for this repository (ADR-0019, ADR-0029). The gates are TESTING.md §8's;
# CONSTRAINTS.md owns their thresholds.
#
# Runner: GitHub-hosted by default. To move to Blacksmith, set the repository
# variable CI_RUNNER to a Blacksmith label (e.g. blacksmith-2vcpu-ubuntu-2404)
# once the repo lives in a GitHub organization with the Blacksmith app
# installed. Any label must be Linux x64: jobs download linux x64 builds of
# gitleaks, uv and osv-scanner.
#
# Supply chain: third-party actions are pinned by commit SHA (SECURITY.md) and
# the repository only allows GitHub-owned actions plus fallow-rs/fallow, so
# tools come as release binaries checked against a pinned sha256. The one
# exception is Playwright's headless shell and its system packages: the
# locked playwright package fetches them itself (browser tests). Jobs get a
# read-only token; nothing here needs a secret, so fork PRs run the same checks
# with the same (lack of) privileges.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so an advisory published against an unchanged uv.lock still fails
  # a run (TESTING.md §1). Every job but fallow runs.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardrails:
    name: guardrails
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The guard runs on a bare interpreter, as Claude Code runs it; the
      # tests jobs run these tests again under pytest.
      - name: Guard tests
        run: python -m unittest discover -s .claude/hooks
      - name: Policy scan (AGENTS.md rules 1 and 9, §6)
        run: python .claude/hooks/policy_guard.py --scan

  # The test suite, in shards that python then gates (ADR-0029's 2026-10-23
  # amendment). The root conftest.py's --shard gives each whole test files,
  # balanced on .github/shard-durations.json; check_shards.py --durations
  # rewrites that table from a main run's shard records.
  tests:
    name: tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # Every shard runs to the end, so a run lists every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # uv runs the gates on setup-python's interpreter, or fails if it doesn't
      # match .python-version; it never downloads another.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv (checksum-verified)
        # Scoped to this step: uv reads its settings from UV_* variables.
        env:
          UV_VERSION: 0.11.15
          UV_SHA256: b03e572f010bea94a4a52d42671ba72981e12894f71576181a1d26ff68546da7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/uv-bin"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/uv-bin" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
      # --locked fails if uv.lock is out of date with the pyproject files, so
      # the gates run on exactly the locked versions.
      - name: Install the workspace from uv.lock
        run: uv sync --locked
      # The browser tests launch Playwright's headless shell with Chromium's
      # sandbox on. GitHub's ubuntu-24.04 runners block that sandbox through
      # AppArmor, so the job logs the setting, then relaxes it on this
      # throwaway runner (ADR-0026). A runner without the setting fails the
      # job here: check these steps on it first (LAB_NOTES.md watch list).
      - name: Install Playwright's headless shell
        run: uv run playwright install --with-deps --only-shell chromium
      - name: Record the runner's AppArmor setting for user namespaces
        run: sysctl kernel.apparmor_restrict_unprivileged_userns
      - name: Allow unprivileged user namespaces (ADR-0026)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # This shard's share of the packages, bench/harness, the guard's tests
      # and tests/, including the browser tests and CONSTRAINTS.md's threshold
      # checks. A shard measures part of the suite, so pytest-cov's floor
      # check is off here: python holds the floor on every shard's data.
      - name: Tests and coverage data, one shard
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: uv run pytest --cov --cov-report= --cov-fail-under=0 --shard "$SHARD" --shard-record shard-record.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.shard }}
          path: |
            .coverage
            shard-record.json
          include-hidden-files: true
          if-no-files-found: error
          # A re-run of the job replaces its earlier upload.
          overwrite: true

  python:
    name: python
    needs: tests
    # A skipped required check passes, so python always runs. When a shard
    # failed, was cancelled or was skipped, the download is skipped and
    # check_shards.py, finding no records, fails the job.
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv (checksum-verified)
        # Scoped to this step: uv reads its settings from UV_* variables.
        env:
          UV_VERSION: 0.11.15
          UV_SHA256: b03e572f010bea94a4a52d42671ba72981e12894f71576181a1d26ff68546da7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  $RUNNER_TEMP/uv.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/uv-bin"
          tar -xzf "$RUNNER_TEMP/uv.tar.gz" -C "$RUNNER_TEMP/uv-bin" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
      # --locked fails if uv.lock is out of date with the pyproject files, so
      # the gates run on exactly the locked versions.
      - name: Install the workspace from uv.lock
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (packages, spikes and tests)
        run: uv run mypy
      # Scripts import each other by bare name, so they are named by file, in
      # a run of their own (ADR-0029).
      - name: Types (scripts)
        run: uv run mypy --strict --no-explicit-package-bases .claude/hooks bench/harness .github/scripts conftest.py
      - name: Download the shards' coverage data and records
        if: needs.tests.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          path: shards
      - name: Every collected test ran in exactly one shard
        run: python .github/scripts/check_shards.py shards
      - name: Combine the shards' coverage data
        run: uv run coverage combine shards/*/.coverage
      # pyproject.toml's fail_under, as `uv run pytest --cov` applies it.
      - name: Coverage floor (CONSTRAINTS.md)
        run: uv run coverage report
      # The total to the hundredth, as pytest --cov prints it.
      - name: Coverage total
        run: uv run coverage json -q -o - | jq .totals.percent_covered

  dependency-audit:
    name: dependency-audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # CONSTRAINTS.md's "Dependency audit" row; tests/test_constraints.py
      # runs the script against a fake scanner. The second file is the lock
      # of the benchmark's checks image (ADR-0029's 2026-10-01 amendment).
      - name: Audit uv.lock and the checks image's lock
        run: .github/scripts/audit-lockfile.sh "$RUNNER_TEMP/osv-scanner" uv.lock bench/harness/checks-requirements.txt

  secrets:
    name: secrets
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  fallow:
    name: fallow
    # fallow audit gates what a pull request changes (ADR-0018).
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the action reads the PR diff to scope findings to added lines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: fallow-rs/fallow@2b0f0b7283637bd408ae54942452b7468cc68f79 # v3.30.0
        with:
          command: audit
          version: 3.30.0

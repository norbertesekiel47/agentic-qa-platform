# The floor's moves in CI (CONSTRAINTS.md, Floor; ADR-0028 amendment,
# 2026-10-01). policy_guard's per-call checks run only in Claude Code, so this
# job runs `policy_guard.py --diff` on every pull request:
# - a refused finding (a new suppression, skip, tautology, stub or swallowed
#   exception) always fails it;
# - an approval-class finding (a deleted test, fewer assertions, a changed
#   gate config, an edit to the guard) is listed in the job's log and doesn't
#   fail it: the maintainer's review and merge approve it (ADR-0028's
#   2026-11-10 amendment).
#
# Runner, supply-chain and token notes: ci.yml's header (ADR-0019, ADR-0029).

name: floor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: floor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  floor:
    name: floor
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch's history, so main and the merge base resolve.
          fetch-depth: 0
          persist-credentials: false
      # The guard runs on a bare interpreter, as Claude Code runs it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: The floor's moves since main
        env:
          # A committed __pycache__ can't stand in for the guard's source.
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        # The full ref: a tag named origin/main would win over a short name.
        run: python .claude/hooks/policy_guard.py --diff refs/remotes/origin/main

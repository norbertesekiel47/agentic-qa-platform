<header id="toolbar">

</header>
<main id="order">

    <section id="details" hidden>
        <p id="summary">Order 42 ships on Monday</p>
    </section>
</main>
<footer>

</footer>

        <p>Get our newsletter</p>
        <button onclick="document.querySelector('#overlay').remove()">No thanks</button>
    </div>
</div>

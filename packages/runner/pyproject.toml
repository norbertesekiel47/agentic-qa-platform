[project]
name = "aqa-runner"
version = "0.1.0"
description = "The Agentic QA runner: run graph, tools, model router and browser session."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "aqa-core",
    "h11==0.16.0",
    "langchain-anthropic==1.7.4",
    "langchain-deepseek==1.1.1",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "playwright==1.63.0",
    "structlog==26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

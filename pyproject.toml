# The uv workspace root (ADR-0027). A virtual project: `uv sync` installs its
# dependencies (every workspace member) and the dev group, and never builds the
# root itself. Versions are pinned to TECH_STACK.md §1.
[project]
name = "aqa-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aqa-bench-harness",
    "aqa-cli",
    "aqa-core",
    "aqa-hosted-chromium-spike",
    "aqa-runner",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "hypothesis==6.168.2",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.9",
    "vcrpy==8.3.0",
]

[tool.uv]
package = false
required-version = ">=0.11.15,<0.12"
# Never install litellm, not even as a transitive dependency: its PyPI releases
# were compromised in March 2026, and we vendor its price map instead (ADR-0007
# amendment). No version is below 0, so any resolution that pulls it in fails.
constraint-dependencies = ["litellm<0"]

[tool.uv.workspace]
members = ["packages/*", "bench/harness", "spikes/hosted-chromium"]

# Shared by every member (uv applies root sources workspace-wide).
[tool.uv.sources]
aqa-bench-harness = { workspace = true }
aqa-cli = { workspace = true }
aqa-core = { workspace = true }
aqa-hosted-chromium-spike = { workspace = true }
aqa-runner = { workspace = true }

# The tool settings below point the tools at our code (ADR-0027). Their
# thresholds mirror CONSTRAINTS.md, which owns them, and tests/test_constraints.py
# fails when the two drift apart. The Ruff rule set is chosen here (ADR-0028).

[tool.ruff]
target-version = "py314"
# The vendored benchmark apps are third-party code (ADR-0021), skipped even
# when a path inside them is passed explicitly.
extend-exclude = ["bench/apps"]
force-exclude = true

[tool.ruff.per-file-target-version]
# Code that runs on interpreters older than the workspace's 3.14 must not be
# rewritten into 3.14-only syntax (such as PEP 758's unparenthesized except).
# The guard runs on whatever python3 Claude Code finds, so it keeps Ruff's
# default (3.10); toggle_checks.py runs in the checks image's Python 3.12.
".claude/hooks/**" = "py310"
"bench/harness/**" = "py312"

[tool.ruff.lint]
# An explicit list, so a Ruff upgrade can't move it. The last line keeps the
# rules of Ruff's own default set that the families above leave out.
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "C90", "DTZ", "T10", "T20", "ISC",
    "LOG", "G", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY",
    "FLY", "PERF", "FURB", "RUF", "BLE", "S", "FIX", "SLF", "ASYNC", "FAST",
    "YTT", "EXE", "INT", "FA", "PYI", "PGH005", "TC004", "TC005", "TC007", "TC010", "D419",
]
ignore = [
    "E501",     # ruff format owns line length; it leaves long strings whole
    "PLR2004",  # a literal compared inline (an exit code, a count) reads better than a name
    "TRY003",   # the message at the raise is the context; no exception class per message
    "S603",     # flags every subprocess call; S602 and S604 still catch shell=True
    "S607",     # git, docker and uv resolve from PATH by design
]

[tool.ruff.lint.per-file-ignores]
# The guard's and the harness's tests are unittest-style: the guard's also run
# under a bare `python3 -m unittest`, so pytest's assert style doesn't apply.
".claude/hooks/test_*.py" = ["PT009"]
"bench/harness/test_*.py" = ["PT009", "PT027"]
# pytest tests assert with a plain `assert`.
"packages/*/tests/**" = ["S101"]
"spikes/*/tests/**" = ["S101"]
"tests/**" = ["S101"]
# T20: scripts whose interface is stdout. In package code T20 stays on, because
# a print bypasses structlog's redaction. S104, S105: the secret detector names
# what it looks for, a local host list and the guidance texts for secrets.
".claude/hooks/policy_guard.py" = ["T20", "S104", "S105"]
"bench/harness/**" = ["T20"]
# `password_arg` names a Docker build argument, and fetch() reads the local
# benchmark app over plain http.
"bench/harness/flags.py" = ["S106", "S310"]
# A fake keeps the signature of the protocol it stands in for.
"bench/harness/test_flags.py" = ["ARG002"]
# The spike's trial (ADR-0008 amendment, 2026-09-30). T20: the Fargate task's
# interface is stdout, and a trial's report holds no secret. S104: Lambda's
# proxy reaches the MicroVM's server through the VM's network interface, and
# only requests with a create-microvm-auth-token token get through it.
"spikes/hosted-chromium/src/aqa_hosted_chromium_spike/__main__.py" = ["T20"]
"spikes/hosted-chromium/src/aqa_hosted_chromium_spike/microvm.py" = ["S104"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 5
max-returns = 6
max-branches = 12
max-statements = 50

[tool.mypy]
python_version = "3.14"
strict = true
# The packages, the spikes and the cross-package tests. The scripts in
# bench/harness and .claude/hooks import each other by bare name, so they get a
# mypy run of their own, named by file (CONSTRAINTS.md, Types; ADR-0029). With
# the scripts off mypy_path, package code can't import one here, just as it
# can't for users.
files = ["packages", "spikes", "tests"]
exclude = ["^bench/apps/"]
# Module names come from these bases, not from the directory layout: each
# package's src. Package tests sit outside every base, so they are named by
# their path (packages.cli.tests.test_version) and may share a basename.
explicit_package_bases = true
mypy_path = [
    "packages/core/src",
    "packages/runner/src",
    "packages/cli/src",
    "spikes/hosted-chromium/src",
]

[tool.pytest]
# strict turns on strict_config, strict_markers, strict_xfail and
# strict_parametrization_ids; a warning fails the test that raised it.
strict = true
filterwarnings = ["error"]
testpaths = ["packages", "spikes", "bench/harness", ".claude/hooks", "tests"]
# importlib mode lets test files in different packages share a basename
# (pytest's advice for new projects). The harness's tests import each other by
# bare name, as under unittest, so its directory is on the path, and namespace
# resolution imports each of its modules once, under that name.
addopts = ["--import-mode=importlib"]
consider_namespace_packages = true
pythonpath = ["bench/harness"]
# pytest's defaults, plus the vendored apps (ADR-0021).
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "bench/apps",
]

# The gate is `uv run pytest --cov`. `--cov` stays out of addopts, so a partial
# run (one file, one test) isn't held to the whole suite's floor.
[tool.coverage.run]
branch = true
source = ["packages", "spikes", "bench/harness", ".claude/hooks"]
# toggle_checks.py runs only inside the checks image (ADR-0023), where no unit
# test reaches it. Every pattern starts with `*`: coverage anchors any other
# pattern to the cwd of each process, and a subprocess may start elsewhere.
omit = ["*/tests/*", "*/test_*.py", "*/conftest.py", "*/bench/harness/toggle_checks.py"]
# The guard's and the CLI's tests run their code as subprocesses.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 94
precision = 0
show_missing = true
skip_empty = true
# Workspace members have no __init__.py above their src/ package, so without
# this a module no test imports would be left out of the total, not counted.
include_namespace_packages = true

# Serves the Conduit SPA and proxies /api to the backend, so the whole app is a
# single origin: the only one a benchmark spec needs in allowed_origins.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

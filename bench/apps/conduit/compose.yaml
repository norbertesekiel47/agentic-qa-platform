# Conduit benchmark app (ADR-0020). From this directory: docker compose up --build --wait
# The app is served at http://127.0.0.1:4100, bound to loopback only.
# Reset the app state: docker compose restart backend
# Switch benchmark cases with bench/harness/flags.py (ADR-0022). It sets BENCH_FLAGS
# (comma-separated opaque flag ids; empty = the clean app) and recreates both
# containers. A plain `docker compose up` takes BENCH_FLAGS from your shell.
name: conduit-bench

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        # Public fixture password for the seeded accounts (see README.md), not a secret.
        CONDUIT_SEED_PASSWORD: conduit-bench-password
    environment:
      # Fixture signing key for a local, throwaway app; not a secret.
      JWT_SECRET: conduit-bench-jwt-fixture
      BENCH_FLAGS: ${BENCH_FLAGS:-}
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/tags'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      # Poll fast while starting, so a case switch isn't gated on the 2 s interval.
      start_period: 30s
      start_interval: 250ms

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      BENCH_FLAGS: ${BENCH_FLAGS:-}
    ports:
      - "127.0.0.1:4100:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
      # Poll fast while starting, so a case switch isn't gated on the 2 s interval.
      start_period: 30s
      start_interval: 250ms

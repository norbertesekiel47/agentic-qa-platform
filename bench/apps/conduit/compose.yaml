# Conduit benchmark app (ADR-0020). From this directory: docker compose up --build --wait
# The app is served at http://127.0.0.1:4100, bound to loopback only.
# Reset the app state: docker compose restart backend
name: conduit-bench

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        # Public fixture password for the seeded accounts (see README.md), not a secret.
        CONDUIT_SEED_PASSWORD: conduit-bench-password
    environment:
      # Fixture signing key for a local, throwaway app; not a secret.
      JWT_SECRET: conduit-bench-jwt-fixture
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/tags'); process.exit(r.ok ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:4100:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
